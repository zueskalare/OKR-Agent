[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "okr-agent"
version = "1.0.0"
description = "OKR-Agent (AtomAgents): an Objectives-and-Key-Results-driven multi-agent framework for mechanical design and simulation with LAMMPS and FEniCSx"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "BioDMX Lab, University of Georgia"}]
# The study ran on CPython 3.11.14 (conda-forge). The scientific stack
# (fenics-dolfinx 0.9.0, petsc4py 3.24.0, ovito 3.13.1) is pinned to that
# interpreter in environment.yml / requirements.txt.
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openai>=2.53",
    "anthropic>=0.120",
    "langchain>=1.3",
    "langchain-core>=1.5",
    "langchain-openai>=1.4",
    "langchain-anthropic>=1.5",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-mcp-adapters>=0.3",
    "mcp[cli]>=1.29",
    "pydantic>=2.11",
    "numpy>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "aiosqlite>=0.20",
    "tavily-python>=0.7",
    "pillow>=11.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Rendering / post-processing used by the MCP tools and analysis scripts.
analysis = [
    "pyvista>=0.46",
    "meshio>=5.3",
    "h5py>=3.15",
    "matplotlib>=3.9",
    "scipy>=1.14",
]
# On-device embeddings (ATOMAGENTS_EMBED_PROVIDER=local). Not used by the campaign.
local-embeddings = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "nbformat>=5.10",
]

[project.urls]
Repository = "https://github.com/zueskalare/OKR-Agent"
Paper = "https://doi.org/10.1002/aisy.70569"
"Run records (dataset)" = "https://huggingface.co/datasets/BioDMX-UGA/OKRAgent_runs"

[tool.setuptools.packages.find]
include = ["AtomAgents*", "backend*", "benchmarks*"]

[tool.setuptools.package-data]
AtomAgents = ["templates/**/*.yaml", "mcp_service/*.md"]
benchmarks = ["briefs/*", "prompts/*", "tools.lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "AtomAgents/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
